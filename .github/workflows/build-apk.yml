name: Build APK

# 云端构建行车记录仪助手 APK（GitHub Actions，ubuntu-latest runner）
# 触发：推送到 main 自动构建；也可在 Actions 页面手动 workflow_dispatch；
#       打 v* 标签（如 v1.0.2）时额外发布 GitHub Release 并附上 APK。
on:
  # 仅打 v* 标签时触发云端签名构建；push 到 main 不再自动构建。
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# 仅打 tag 时需要写权限来创建 Release；普通构建不需要。
permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # 将 Secrets 映射为 job 级环境变量（secrets 不能在 if: 条件里直接使用）。
    # 若未配置以下 Secret，则产出未签名 APK（app-release-unsigned.apk）。
    # 配置方法（仓库 Settings → Secrets and variables → Actions → New repository secret）：
    #   SIGNING_KEY        =  keystore 文件的 base64（本地执行：base64 -w0 upload.keystore）
    #   KEY_ALIAS          =  keystore 别名
    #   KEY_STORE_PASSWORD =  keystore 密码
    #   KEY_PASSWORD       =  key 密码
    # 密钥仅存于加密 Secrets，不会进入仓库或构建日志。
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      # GitHub 托管的 runner 已预置一份 SDK 并导出为 ANDROID_SDK_ROOT；
      # 若两个变量指向不同路径，AGP 会报“SDK 路径冲突”而失败。
      # 这里把两者指向同一目录，消除冲突。
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 手动安装 Android SDK（不使用已失效的 android-actions/setup-android@v3，
      # 该 action 仍尝试安装已被移除的 tools 包导致失败）。
      - name: Set up Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 仓库未内置 Gradle Wrapper；用 setup-gradle 直接安装 Gradle 8.9 并暴露 gradle 命令。
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore (optional)
        if: ${{ env.SIGNING_KEY != '' }}
        run: echo "$SIGNING_KEY" | base64 -d > keystore.jks

      - name: Write local.properties for signing (optional)
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          {
            echo "DASHCAM_KEYSTORE=keystore.jks"
            echo "DASHCAM_STORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "DASHCAM_KEY_ALIAS=$KEY_ALIAS"
            echo "DASHCAM_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashcam-assistant-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
