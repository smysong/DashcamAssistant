# 编码 / 内存参数（通用好习惯，消除非 ASCII 路径与内存压力问题）
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvmargs\="-Xmx2048m"
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# AndroidX / 资源
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.testTimeout=30000
# The workspace is stored under a non-ASCII Windows path; AGP requires opting into this path explicitly.
android.overridePathCheck=true

# Kotlin 官方代码风格
kotlin.code.style=official
